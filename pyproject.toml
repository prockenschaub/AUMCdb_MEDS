[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "AUMCdb-MEDS"
dynamic = ["version"]
authors = [
  { name="Patrick Rockenschaub", email="rockenschaub.patrick@gmail.com" },
  { name="Robin van de Water", email="r.p.vandewater@gmail.com" },
  { name="Matthew McDermott", email="mattmcdermott8@gmail.com" },
  { name="Pawel Renc", email="rencpawe@gmail.com" },
]
description = "A MEDS-Extract ETL pipeline that converts AmsterdamUMCdb into the MEDS format."
readme = "README.md"
# Mirrors MEDS-Extract 0.9's own floor and ceiling. A looser range admits interpreters it cannot
# be installed on, and uv then refuses to resolve the project at all.
requires-python = ">=3.11.4,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# Pure-config ETL: MEDS-Extract supplies both CLIs (`meds-extract-download`, `meds-extract-run`)
# and every extraction stage. It is capped below the next minor because MEDS-Extract 0.x minors are
# breaking (MESSY syntax, runner CLI), so raise it deliberately when migrating. 0.8 renamed the MESSY
# `_table.join` key to `_table.joins`, which the config uses (0.7 rejects the new key and 0.8 the old
# one), and decodes `_metadata` sources with `etl.encoding` too. 0.8.1 runs the `etl.post_stages`
# the config declares and writes its dataset.json fields; 0.9.0 is the floor because it writes
# `unit` in codes.parquet as one string per code (and fails on a code with more than one unit).
# suMEDS 0.6.2 registers the `sumeds_enrich` stage the config declares as a post-stage, which
# enriches the code metadata with the rules registered below. A failed enrichment is a warning that
# keeps the ETL output (e.g. without internet), and `metadata/dataset.json` records whether the build
# was enriched. 0.6 writes `parent_names` as a code-to-name map. It is capped below the next minor
# for the same reason (its rules format and CLI are still 0.x). 0.6.6 registers
# `sumeds_link_unit_siblings`, the first post-stage, which links codes that differ only in their unit.
# suMEDS 0.6.9 adds the `link_single_units` option of `sumeds_link_unit_siblings`, which the spec
# sets.
dependencies = [
  # 0.9.2 is the first MEDS-Extract release that reads the spec's
  # `etl.cleanup_intermediates` (mmcdermott/MEDS_extract#340).
  "MEDS-extract[download]>=0.9.2,<0.10",
  # suMEDS 0.6.10 ships `UnitComponentContract`, which tests/test_unit_component.py runs on the spec;
  # 0.6.11 adds its `require_unit_in_code` option.
  "sumeds>=0.6.11,<0.7",
]

[tool.setuptools_scm]

[tool.setuptools.package-data]
AUMCdb_MEDS = ["configs/*.yaml", "sumeds_rules.yaml"]

[project.optional-dependencies]
# suMEDS's `testing` extra: `UnitComponentContract` (tests/test_unit_component.py) and dftly.
dev = ["pre-commit<4", "pytest", "sumeds[testing]>=0.6.11,<0.7"]
local_parallelism = ["hydra-joblib-launcher"]
slurm_parallelism = ["hydra-submitit-launcher"]

# Registers the bundled MESSY file as a MEDS-Extract dataset pipeline, so the whole
# ETL is runnable as `meds-extract-run spec=AUMCdb output_dir=...`.
[project.entry-points."MEDS_extract.pipelines"]
AUMCdb = "AUMCdb_MEDS.configs:messy.yaml"

# Registers the suMEDS rules under the same name, so the config's `sumeds_enrich: {rules: AUMCdb}`
# and `--rules AUMCdb` find them.
[project.entry-points."sumeds.rules"]
AUMCdb = "AUMCdb_MEDS:sumeds_rules.yaml"

[project.urls]
Homepage = "https://github.com/prockenschaub/AUMCdb_MEDS"
Issues = "https://github.com/prockenschaub/AUMCdb_MEDS/issues"
