[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "AUMCdb-MEDS"
dynamic = ["version"]
authors = [
  { name="Patrick Rockenschaub", email="rockenschaub.patrick@gmail.com" },
  { name="Robin van de Water", email="r.p.vandewater@gmail.com" },
  { name="Matthew McDermott", email="mattmcdermott8@gmail.com" },
  { name="Pawel Renc", email="rencpawe@gmail.com" },
]
description = "A MEDS-Extract ETL pipeline that converts AmsterdamUMCdb into the MEDS format."
readme = "README.md"
# Mirrors MEDS-Extract 0.8's own floor and ceiling. A looser range admits interpreters it cannot
# be installed on, and uv then refuses to resolve the project at all.
requires-python = ">=3.11.4,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# Pure-config ETL: MEDS-Extract supplies both CLIs (`meds-extract-download`, `meds-extract-run`)
# and every extraction stage. It is capped below the next minor because MEDS-Extract 0.x minors are
# breaking (MESSY syntax, runner CLI), so raise it deliberately when migrating. 0.8 is the floor
# because it renamed the MESSY `_table.join` key to `_table.joins`, which the config uses (0.7
# rejects the new key and 0.8 the old one), and decodes `_metadata` sources with `etl.encoding` too.
# suMEDS provides `suMEDS-extract`, which runs this ETL and then enriches its code metadata with the
# rules registered below. 0.6 is the first release that writes `parent_names` as a code-to-name map;
# it is capped below the next minor for the same reason (its rules format and CLI are still 0.x).
dependencies = [
  "MEDS-extract[download]>=0.8.0,<0.9",
  "sumeds>=0.6,<0.7",
]

[tool.setuptools_scm]

[tool.setuptools.package-data]
AUMCdb_MEDS = ["configs/*.yaml", "sumeds_rules.yaml"]

[project.optional-dependencies]
dev = ["pre-commit<4", "pytest"]
local_parallelism = ["hydra-joblib-launcher"]
slurm_parallelism = ["hydra-submitit-launcher"]

# Registers the bundled MESSY file as a MEDS-Extract dataset pipeline, so the whole
# ETL is runnable as `meds-extract-run spec=AUMCdb output_dir=...`.
[project.entry-points."MEDS_extract.pipelines"]
AUMCdb = "AUMCdb_MEDS.configs:messy.yaml"

# Registers the suMEDS rules under the same name, so `suMEDS-extract spec=AUMCdb` and
# `--rules AUMCdb` find them.
[project.entry-points."sumeds.rules"]
AUMCdb = "AUMCdb_MEDS:sumeds_rules.yaml"

[project.urls]
Homepage = "https://github.com/prockenschaub/AUMCdb_MEDS"
Issues = "https://github.com/prockenschaub/AUMCdb_MEDS/issues"
