[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "AUMCdb-MEDS"
dynamic = ["version"]
authors = [
  { name="Patrick Rockenschaub", email="rockenschaub.patrick@gmail.com" },
  { name="Robin van de Water", email="r.p.vandewater@gmail.com" },
  { name="Matthew McDermott", email="mattmcdermott8@gmail.com" },
  { name="Pawel Renc", email="rencpawe@gmail.com" },
]
description = "A MEDS-Extract ETL pipeline that converts AmsterdamUMCdb into the MEDS format."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# Pure-config ETL: the only runtime dependency is MEDS-Extract itself, which supplies both
# CLIs (`meds-extract-download`, `meds-extract-run`) and every extraction stage.
dependencies = ["MEDS-extract[download]>=0.7.1,<0.8"]

[tool.setuptools_scm]

[tool.setuptools.package-data]
AUMCdb_MEDS = ["configs/*.yaml", "sumeds_rules.yaml"]

[project.optional-dependencies]
dev = ["pre-commit<4", "pytest"]
local_parallelism = ["hydra-joblib-launcher"]
slurm_parallelism = ["hydra-submitit-launcher"]

# Registers the bundled MESSY file as a MEDS-Extract dataset pipeline, so the whole
# ETL is runnable as `meds-extract-run spec=AUMCdb output_dir=...`.
[project.entry-points."MEDS_extract.pipelines"]
AUMCdb = "AUMCdb_MEDS.configs:messy.yaml"

[project.urls]
Homepage = "https://github.com/prockenschaub/AUMCdb_MEDS"
Issues = "https://github.com/prockenschaub/AUMCdb_MEDS/issues"
