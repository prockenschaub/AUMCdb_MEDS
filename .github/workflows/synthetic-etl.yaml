# Runs the ETL without access to AmsterdamUMCdb: tests/conftest.py writes a tiny synthetic dataset
# with the layout and encodings of the real files, and the tests run `meds-extract-run spec=AUMCdb`
# over it, with and without its suMEDS enrichment stage (offline, against a synthetic ontology pack).
#
# MESSY_synth generated the synthetic data here before, but it still pins MEDS-extract<0.8 and cannot
# read the 0.8 config (`_table.joins`, a per-source `etl.encoding`), even in its own environment.

name: Synthetic ETL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/*", "dev", "feat/*"]

jobs:
  synthetic-etl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install packages
        run: |
          pip install .[dev]

      - name: Run the synthetic ETL and the tests
        run: |
          pytest -q tests
