# Runs the ETL without access to AmsterdamUMCdb, in two ways:
#
# - `tests`: tests/conftest.py writes a tiny synthetic dataset with the layout and encodings of the
#   real files, and the tests run `meds-extract-run spec=AUMCdb` over it, with and without its suMEDS
#   enrichment stage (offline, against a synthetic ontology pack). They check specific values.
# - `messy-synth`: MESSY-synth generates raw tables straight from the shipped MESSY config and runs
#   every event over them, failing the job if any event yields no rows. This catches expressions
#   that only work on the dtypes of one particular release. The full ETL then runs over those
#   tables, including the sumeds_enrich post-stage.

name: Synthetic ETL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/*", "dev", "feat/*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-etl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install packages
        run: |
          pip install .[dev]

      - name: Run the synthetic ETL and the tests
        run: |
          pytest -q tests

  messy-synth:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        # MESSY-synth requires Python >= 3.12.
        python-version: ["3.12", "3.13"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          # The repository has no uv.lock, so this resolves the dependencies afresh (no --locked).
          uv sync
          # MEDS-Extract 0.8 support (`_table.joins`, per-source `etl.encoding`) is on MESSY_synth's
          # main branch but not in a PyPI release yet, so pin the commit until one is published.
          uv pip install "MESSY_synth @ git+https://github.com/mmcdermott/MESSY_synth@5585b7a66b44e27f9e55b9f7d9ed4321cfe27a63"

      - name: Generate and extract synthetic data
        # The synthetic tables include the item dictionary, and do_download=false keeps
        # meds-extract-run from fetching anything. Only sumeds_enrich downloads (public ontology
        # packs); if that fails, the stage warns and keeps the ETL output.
        run: |
          uv run --no-sync MESSY-synth ./src/AUMCdb_MEDS/configs/messy.yaml -o raw_synthetic/ --explain
          uv run --no-sync meds-extract-run spec=AUMCdb output_dir=./AUMCdb_meds_synth \
            input_dir=raw_synthetic do_download=false
          for f in dataset.json codes.parquet subject_splits.parquet; do
            test -f "AUMCdb_meds_synth/metadata/$f"
          done
